# Example only: nothing deploys this yet. See docs/W8-SYNC.md for the steps that come first.
# Real values go in a .env file on the host that is never committed.
name: gym-dtwin-api
services:
  gym-dtwin-api:
    build: ${SERVER_DIR:-./server}
    image: gym-dtwin-api:local
    container_name: gym-dtwin-api
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: .env
        required: true
    volumes:
      - ./data:/data
    networks:
      - edge

networks:
  edge:
    external: true
    name: dtwin-prod_default
