# Static analysis of GitHub Actions workflows (https://docs.zizmor.sh).
# Fails the run on medium+ findings; results show in the job log (no SARIF: code scanning is not available on private repos).
name: zizmor

on:
  pull_request:
    paths: [".github/workflows/**", ".github/actions/**"]
  push:
    branches: [main]
    paths: [".github/workflows/**", ".github/actions/**"]

permissions: {}

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          min-severity: medium
